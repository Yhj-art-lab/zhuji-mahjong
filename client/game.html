<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>诸暨麻将 · 联机对局</title>
<link rel="stylesheet" href="/single/style.css?v=stage5">
<style>
  /* 联机对局页仅复用单机牌桌样式，局部小调整 */
  .topbar h1 { font-size: 20px; }
  .topbar .sub { font-size: 12px; font-weight: normal; opacity: .75; }
  /* 最近打出的一张牌：金色描边 + 脉冲提示 */
  .tile.last-discard {
    box-shadow: 0 0 0 2px #f5c542, 0 2px 6px rgba(0,0,0,.4);
    animation: last-discard-pulse 1.1s ease-out;
  }
  @keyframes last-discard-pulse {
    0%   { transform: scale(1.35); }
    60%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  /* 鸣牌副露入场过渡 */
  .set-group.set-pop {
    animation: set-pop-in .26s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes set-pop-in {
    0%   { transform: scale(.55); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  /* 连庄状态说明行 */
  .hud-line {
    font-size: 14px; font-weight: bold; color: #e8f4ec;
    background: rgba(0,0,0,.28); border-radius: 9px; padding: 5px 12px;
    white-space: nowrap;
  }
  .hud-line.streak-warn { color: #ffe08a; border: 1px solid rgba(245,197,66,.6); }
  .hud-line.streak-hot {
    color: #fff; background: linear-gradient(#e85a3c, #b3270e);
    animation: streak-hot-glow 1.2s ease-in-out infinite alternate;
  }
  @keyframes streak-hot-glow {
    from { box-shadow: 0 0 4px rgba(232,90,60,.5); }
    to   { box-shadow: 0 0 14px rgba(232,90,60,.95); }
  }
  .action-btn.btn-bugang-online {
    background: linear-gradient(#a48cff, #6f52d8);
    border-color: #4b32a8;
    color: #fff;
  }
  #btn-exit {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    padding: 5px 14px; font-size: 13px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.12);
    color: #fff; cursor: pointer;
  }
  .seat-info.offline { opacity: .5; }
  /* 2/3 人局：隐藏非活动座位的全部 DOM */
  .slot-hidden { display: none !important; }
  /* 带分模式提示 */
  .modal-bank { font-size: 13.5px; color: #ffd9a0; line-height: 1.7;
    background: rgba(120,60,10,.35); border-radius: 8px; padding: 6px 12px;
    white-space: pre-line; margin-top: 4px; }
  .balance-tag { color: #ffd9a0; font-weight: bold; }
  /* 联机动作栏：水平居中（复用单机 .action-bar 视觉） */
  #online-action-bar {
    left: 50%; right: auto;
    transform: translateX(-50%);
  }
  .action-bar-label {
    color: #ffe08a; font-size: 15px; font-weight: bold; letter-spacing: 1px;
    padding: 0 8px;
  }
  .action-btn.btn-angang-online {
    background: linear-gradient(#ffb066, #f07f2e);
    border-color: #b35410;
    color: #fff;
  }
  #settle-confirms { font-size: 13px; color: #cfe8d9; }
  #btn-next-round:disabled { opacity: .55; cursor: default; }
  #boot-error {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; z-index: 99; color: #fff; font-size: 16px;
    background: rgba(0,0,0,.55);
  }
  #boot-error.show { display: flex; }
  #boot-error a { color: #ffe08a; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar" style="position:relative">
    <h1>诸暨麻将 <span class="sub">（联机对战 · 阶段七：2/3/4人局 · 累计/带分模式）</span></h1>
    <button id="btn-exit" type="button">退出对局</button>
  </div>

  <!-- 牌桌左上角 HUD：财神 + 翻基准牌 + 牌墙剩余张数 + 骰子 -->
  <div class="hud-topleft" id="hud-topleft">
    <div class="hud-block hud-wilds">
      <span class="hud-label">财神</span>
      <span class="cp-slot hud-slot cp-slot-wild" id="wild-slot"><span class="placeholder">待开局</span></span>
    </div>
    <div class="hud-block">
      <span class="hud-label">翻基准</span>
      <span class="cp-slot hud-slot" id="indicator-slot"><span class="placeholder">待开局</span></span>
    </div>
    <div class="hud-block hud-wall">余牌 <b id="wall-count">--</b></div>
    <div class="hud-block hud-dice" id="hud-dice">
      <div class="dice-box dice-settled" id="dice-box">
        <div class="die die-idle" id="die-1"></div>
        <div class="die die-idle" id="die-2"></div>
      </div>
    </div>
    <div class="hud-line" id="streak-info">首局 · 无连庄</div>
  </div>

  <div class="table" style="position:relative">
    <!-- 物理四边信息条（内容按本人视角旋转映射） -->
    <div class="seat-info seat-info-n" data-slot="3">
      <span class="seat-name" id="name-slot-3">北家</span>
      <span class="tile-count" id="count-slot-3">0 张</span>
      <span class="seat-score" id="score-slot-3">0 分</span>
    </div>
    <div class="seat-info seat-info-e" data-slot="0">
      <span class="seat-name" id="name-slot-0">东家</span>
      <span class="tile-count" id="count-slot-0">0 张</span>
      <span class="seat-score" id="score-slot-0">0 分</span>
    </div>
    <div class="seat-info seat-info-w" data-slot="2">
      <span class="seat-name" id="name-slot-2">西家</span>
      <span class="tile-count" id="count-slot-2">0 张</span>
      <span class="seat-score" id="score-slot-2">0 分</span>
    </div>
    <div class="seat-info seat-info-s" data-slot="1">
      <span class="seat-name" id="name-slot-1">南家</span>
      <span class="tile-count" id="count-slot-1">0 张</span>
      <span class="seat-score" id="score-slot-1">0 分</span>
    </div>

    <div class="table-inner">
    <!-- 牌墙（物理四排，内容随视角映射） -->
    <div class="wall-row wall-row-h wall-top" id="wall-slot-3"></div>
    <div class="wall-row wall-row-v wall-right" id="wall-slot-2"></div>
    <div class="wall-row wall-row-h wall-bottom" id="wall-slot-1"></div>
    <div class="wall-row wall-row-v wall-left" id="wall-slot-0"></div>

    <!-- 副露组（物理四角） -->
    <div class="melds mcorner mcorner-tl" id="sets-slot-0"></div>
    <div class="melds mcorner mcorner-tr" id="sets-slot-3"></div>
    <div class="melds mcorner mcorner-bl" id="sets-slot-1"></div>
    <div class="melds mcorner mcorner-br" id="sets-slot-2"></div>

    <!-- 顶部对家牌背 -->
    <div class="seat seat-top" data-slot="3">
      <div class="backs" id="backs-slot-3"></div>
    </div>
    <!-- 左侧牌背 -->
    <div class="seat seat-left" data-slot="0">
      <div class="backs backs-v" id="backs-slot-0"></div>
    </div>
    <!-- 右侧牌背 -->
    <div class="seat seat-right" data-slot="2">
      <div class="backs backs-v" id="backs-slot-2"></div>
    </div>

    <!-- 中央罗盘 -->
    <div class="center-stage">
      <div class="center-panel compass-panel">
        <div class="compass" id="compass">
          <span class="wind wind-n" id="wind-3">北</span>
          <span class="wind wind-e" id="wind-0">东</span>
          <span class="wind wind-w" id="wind-2">西</span>
          <span class="wind wind-s" id="wind-1">南</span>
          <span class="lamp" id="lamp-3"></span>
          <span class="lamp" id="lamp-0"></span>
          <span class="lamp" id="lamp-2"></span>
          <span class="lamp" id="lamp-1"></span>
          <span class="streak-box streak-n" id="streak-box-3">00</span>
          <span class="streak-box streak-e" id="streak-box-0">00</span>
          <span class="streak-box streak-w" id="streak-box-2">00</span>
          <span class="streak-box streak-s" id="streak-box-1">00</span>
          <div class="center-timer hidden" id="center-timer">00</div>
          <div class="dice-stage" id="dice-stage"></div>

          <div class="discard discard-ring discard-ring-top" id="discard-slot-3"></div>
          <div class="discard discard-ring discard-ring-left" id="discard-slot-0"></div>
          <div class="discard discard-ring discard-ring-right" id="discard-slot-2"></div>
          <div class="discard discard-ring discard-ring-bottom" id="discard-slot-1"></div>
        </div>
      </div>
    </div>

    <!-- 底部手牌区（始终是"我"） -->
    <div class="seat seat-bottom" data-slot="1">
      <div class="hand" id="hand-slot-1"></div>
    </div>

    <div class="tenpai-bar hidden" id="tenpai-bar"></div>
    </div><!-- /.table-inner -->
  </div>
</div>

<!-- 身份失效提示 -->
<div id="boot-error">
  <div id="boot-error-text">无法进入对局</div>
  <a href="/">返回首页</a>
</div>

<!-- 联机动作栏：鸣牌（胡/杠/碰/过）· 自摸 · 暗杠（内容由 JS 按 myActions 渲染） -->
<div class="action-bar hidden" id="online-action-bar"></div>

<!-- 结算弹窗：胡牌/流局全员弹出，四家确认后再来一局 -->
<div class="modal-mask hidden" id="settle-modal">
  <div class="modal-box">
    <div class="modal-title" id="settle-title">胡牌</div>
    <div class="modal-wilds" id="settle-wilds"></div>
    <div class="modal-way" id="settle-way"></div>
    <div class="modal-streak hidden" id="settle-streak"></div>
    <div class="modal-patterns" id="settle-patterns"></div>
    <div class="modal-tai" id="settle-tai"></div>
    <div class="modal-bank hidden" id="settle-bank"></div>
    <div class="modal-score" id="settle-score"></div>
    <div class="modal-actions">
      <button class="action-btn" id="btn-next-round" type="button">再来一局</button>
    </div>
    <span id="settle-confirms">已确认 0/4</span>
  </div>
</div>

<script src="/single/audio-manager.js?v=1"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/tile-view.js?v=stage5"></script>
<script src="/js/gameClient.js?v=stage7"></script>
</body>
</html>
